name: Build SubHarm

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libx11-dev libxext-dev xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target subharm_core_test subharm_host_test -j 4
      - name: Core test (chords, key, harmony, render pitch check)
        run: |
          mkdir -p out
          ./build/tests/subharm_core_test out
      - name: DAW session test (record, stack, playback, save/restore, export, UI)
        run: |
          mkdir -p out/host
          xvfb-run -a ./build/tests/subharm_host_test_artefacts/Release/subharm_host_test out/host out
      - uses: actions/upload-artifact@v4
        with:
          name: SubHarm-test-audio
          path: out/

  windows:
    name: Windows (VST3 + app + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64 -DSUBHARM_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --target SubHarm_VST3 SubHarm_Standalone subharm_core_test -- /m
      - name: Core test
        run: |
          mkdir out
          .\build\tests\Release\subharm_core_test.exe out
      - name: pluginval (strictness 5)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv -Force
          $p = Start-Process -FilePath .\pv\pluginval.exe -ArgumentList '--strictness-level 5 --validate-in-process --timeout-ms 600000 --output-dir pvlog "build\src\plugin\SubHarm_artefacts\Release\VST3\SubHarm.vst3"' -Wait -PassThru -NoNewWindow
          Get-ChildItem pvlog -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 40 }
          if ($p.ExitCode -ne 0) { Write-Error "pluginval failed"; exit 1 }
      - name: Build .exe installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project \(SubHarm VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $art = "$pwd\build\src\plugin\SubHarm_artefacts\Release"
          New-Item -ItemType Directory -Force -Path installer-out | Out-Null
          & $iscc "/DAppVersion=$ver" "/DVst3Dir=$art\VST3\SubHarm.vst3" "/DAppExe=$art\Standalone\SubHarm.exe" "/O$pwd\installer-out" installer\windows\SubHarm.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem installer-out
      - uses: actions/upload-artifact@v4
        with:
          name: SubHarm-Windows-Installer
          path: installer-out/*.exe

  macos:
    name: macOS (VST3 + AU + app + pkg, Universal)
    # macOS minutes cost 10x on private repos: build Mac for releases (tags) and manual runs
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DSUBHARM_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --target SubHarm_VST3 SubHarm_AU SubHarm_Standalone -- -quiet
      - name: pluginval (VST3 + AU)
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pv.zip
          ART=build/src/plugin/SubHarm_artefacts/Release
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 600000 "$ART/VST3/SubHarm.vst3"
          cp -R "$ART/AU/SubHarm.component" ~/Library/Audio/Plug-Ins/Components/ 2>/dev/null || (mkdir -p ~/Library/Audio/Plug-Ins/Components && cp -R "$ART/AU/SubHarm.component" ~/Library/Audio/Plug-Ins/Components/)
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 600000 ~/Library/Audio/Plug-Ins/Components/SubHarm.component
      - name: Ad-hoc sign + .pkg installer
        run: |
          VER=$(sed -n 's/^project (SubHarm VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          ART=build/src/plugin/SubHarm_artefacts/Release
          ROOT=pkgroot
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Applications"
          cp -R "$ART/VST3/SubHarm.vst3" "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "$ART/AU/SubHarm.component" "$ROOT/Library/Audio/Plug-Ins/Components/"
          cp -R "$ART/Standalone/SubHarm.app" "$ROOT/Applications/"
          for b in "$ROOT/Library/Audio/Plug-Ins/VST3/SubHarm.vst3" "$ROOT/Library/Audio/Plug-Ins/Components/SubHarm.component" "$ROOT/Applications/SubHarm.app"; do
            codesign --force --deep -s - "$b"
          done
          mkdir -p dist
          pkgbuild --root "$ROOT" --identifier xyz.subroo.subharm --version "$VER" --install-location / "dist/SubHarm-$VER-macOS.pkg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: SubHarm-macOS-Installer
          path: dist/*.pkg

  release:
    name: GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test-linux, windows, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="## $VER" 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOT'

          ### Install
          - **Windows:** run `SubHarm-x.y.z-Windows-Setup.exe`. SmartScreen: *More info* -> *Run anyway* (the installer is not code-signed).
          - **macOS:** open `SubHarm-x.y.z-macOS.pkg`. First time: right-click -> *Open* (not notarized).
          EOT
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artifacts/SubHarm-Windows-Installer/*.exe
            artifacts/SubHarm-macOS-Installer/*.pkg
